---
name: Bump `gnupg` version

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  lastReleaseVersion:
    kind: file
    name: Get latest `gnupg` release version
    spec:
      file: https://www.gnupg.org/
      matchpattern: 'The current version of GnuPG is \d+\.\d+\.\d+'
    transformers:
      - trimprefix: 'The current version of GnuPG is '
  lastReleaseDate:
    kind: file
    name: Get latest `gnupg` release date
    spec:
      file: https://www.gnupg.org/
      matchpattern: 'GnuPG {{ source "lastReleaseVersion" }} .* released \(\d+-\d+-\d+\)'
    transformers:
      - findsubmatch:
          pattern: '.*\((\d+-\d+-\d+)'
          captureindex: 1
  LastReleaseVersionAndDate:
    kind: shell
    name: Build `gnupg` Windows version
    spec:
      command: |
        printf "%s_%s" "{{ source "lastReleaseVersion" }}" "{{ source "lastReleaseDate" }}" | tr -d -

targets:
  updateVersion:
    name: Update `gnupg` version in Windows dockerfile
    sourceid: LastReleaseVersionAndDate
    kind: dockerfile
    spec:
      file: windows/windowsservercore/hotspot/Dockerfile
      instruction:
        keyword: "ARG"
        matcher: "GNUGPG_VERSION"
    scmid: default

actions:
  default:
    kind: github/pullrequest
    title: Bump `gnupg` version to {{ source "lastReleaseVersion" }}
    scmid: default
    spec:
      labels:
        - dependencies
        - gnupg
